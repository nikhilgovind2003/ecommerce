openapi: 3.0.3
info:
  title: E-commerce REST API
  version: 1.0.0
  description: |
    Backend for a basic e-commerce application: users, multi-level categories, products and orders.

    **Auth:** send `Authorization: Bearer <token>` (token comes from `/api/auth/login` or `/api/auth/register`).
    **Roles:** `admin` and `customer`. Public sign-up always creates a customer; the first admin comes from `npm run seed:admin`.

    **Errors** always look like `{ "status": "error", "message": "...", "errors": [ { "field": "...", "message": "..." } ] }`.
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Products
  - name: Orders
security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, format: email, example: jane@example.com }
                password: { type: string, minLength: 6, example: secret123 }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Invalid email or password, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Account deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/me:
    put:
      tags: [Users]
      summary: Update own name and/or password
      description: Changing the password requires `currentPassword`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                password: { type: string, minLength: 6 }
                currentPassword: { type: string }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/User' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users:
    get:
      tags: [Users]
      summary: List users (admin)
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [admin, customer] } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: search, in: query, description: Matches name or email, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user (admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: User, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/User' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (admin)
      description: Deactivated users are locked out immediately, even with an unexpired token. Admins cannot deactivate themselves.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/User' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/categories/tree:
    get:
      tags: [Categories]
      summary: Complete category hierarchy
      description: Nested tree of any depth. Inactive branches are hidden unless an admin passes `includeInactive=true`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: includeInactive, in: query, description: Admin only, schema: { type: boolean } }
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  data: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }
  /api/categories:
    get:
      tags: [Categories]
      summary: List categories (flat)
      security: []
      parameters:
        - { name: parent, in: query, description: 'A category id, or the word "null" for root categories', schema: { type: string } }
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
    post:
      tags: [Categories]
      summary: Create a category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Category' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Parent category not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Same name already exists under that parent, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categories]
      summary: Get a category
      security: []
      responses:
        '200': { description: Category, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Category' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categories]
      summary: Update or move a category (admin)
      description: |
        Changing `parent` moves the whole subtree. A category cannot become its own parent or move under
        one of its own descendants (400). Use `"parent": null` to make it a root category.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Category' } } } } } }
        '400': { description: Validation error or circular relationship, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Duplicate sibling name, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Categories]
      summary: Delete a category (admin)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Category still has sub-categories or products, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/products:
    get:
      tags: [Products]
      summary: Storefront product listing
      description: Only active products. Filtering by a category also returns products of all its sub-categories.
      security: []
      parameters:
        - { name: search, in: query, description: Matches name, SKU or description (case-insensitive), schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, description: Compared with the sale price when there is one, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, price_asc, price_desc, name_asc, name_desc], default: newest } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/ProductPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products]
      summary: Create a product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: SKU already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/products/admin/all:
    get:
      tags: [Products]
      summary: Admin product listing (includes inactive)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, price_asc, price_desc, name_asc, name_desc] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/ProductPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Products]
      summary: Product details
      description: Inactive products are only visible to admins (404 otherwise).
      security: [{}, { bearerAuth: [] }]
      responses:
        '200': { description: Product, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Product' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: Update a product (admin)
      description: Partial update. `salePrice` may be `null` to remove the sale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Delete a product (admin)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders:
    post:
      tags: [Orders]
      summary: Place an order (customer)
      description: |
        Send only product ids and quantities. Prices, subtotals and the total are calculated on the server,
        and stock is reduced atomically. Duplicate product lines are merged.
        `400` = items unavailable or not enough stock (details in `errors`), `409` = stock changed while the order was being placed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shippingAddress]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product, quantity]
                    properties:
                      product: { type: string, description: Product id }
                      quantity: { type: integer, minimum: 1, maximum: 1000 }
                shippingAddress: { $ref: '#/components/schemas/Address' }
      responses:
        '201': { description: Order created, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Stock changed while ordering, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Orders]
      summary: List all orders (admin)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: user, in: query, description: Filter by customer id, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orders/my:
    get:
      tags: [Orders]
      summary: My orders (customer)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/orders/my/{id}:
    get:
      tags: [Orders]
      summary: One of my orders (customer)
      description: Orders that belong to someone else return 404.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/my/{id}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel my pending order (customer)
      description: Only `pending` orders can be cancelled by the customer. Stock is returned.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Cancelled order, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '400': { description: Order is no longer pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order changed at the same time, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get any order (admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status (admin)
      description: |
        Allowed transitions: `pending → confirmed | cancelled`, `confirmed → processing | cancelled`,
        `processing → shipped | cancelled`, `shipped → delivered`. `delivered` and `cancelled` are final.
        Cancelling returns the stock.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                note: { type: string, maxLength: 300 }
      responses:
        '200': { description: Updated order, content: { application/json: { schema: { type: object, properties: { status: { type: string }, data: { $ref: '#/components/schemas/Order' } } } } } }
        '400': { description: Invalid status or transition, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order changed at the same time, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, example: 64b0f3c2a1b2c3d4e5f60718 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
  responses:
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Missing, invalid or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Not allowed for this role or account is deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooManyRequests: { description: Rate limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ProductPage:
      description: Page of products
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              data: { type: array, items: { $ref: '#/components/schemas/Product' } }
              pagination: { $ref: '#/components/schemas/Pagination' }
    OrderPage:
      description: Page of orders
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              data: { type: array, items: { $ref: '#/components/schemas/Order' } }
              pagination: { $ref: '#/components/schemas/Pagination' }
  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, customer] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data:
          type: object
          properties:
            token: { type: string }
            user: { $ref: '#/components/schemas/User' }
    Category:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        parent: { type: string, nullable: true }
        ancestors: { type: array, items: { type: string }, description: Ids from the root down to the parent }
        isActive: { type: boolean }
    CategoryNode:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/CategoryNode' }
    CategoryInput:
      type: object
      properties:
        name: { type: string, example: Android Phones, description: Required when creating }
        description: { type: string }
        parent: { type: string, nullable: true, description: Parent category id, or null for a root category }
        isActive: { type: boolean }
    Product:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        sku: { type: string }
        description: { type: string }
        price: { type: number }
        salePrice: { type: number, nullable: true }
        effectivePrice: { type: number, description: Sale price when set, otherwise price }
        stock: { type: integer }
        category: { type: object, properties: { _id: { type: string }, name: { type: string }, slug: { type: string } } }
        status: { type: string, enum: [active, inactive] }
    ProductInput:
      type: object
      description: All of name, sku, price and category are required when creating.
      properties:
        name: { type: string, example: Galaxy S24 }
        sku: { type: string, example: SAM-S24 }
        description: { type: string }
        price: { type: number, minimum: 0, example: 900 }
        salePrice: { type: number, nullable: true, minimum: 0, description: Must not exceed price, example: 800 }
        stock: { type: integer, minimum: 0, example: 25 }
        category: { type: string, description: Category id }
        status: { type: string, enum: [active, inactive] }
    Address:
      type: object
      required: [fullName, phone, line1, city, postalCode, country]
      properties:
        fullName: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, shipped, delivered, cancelled]
    Order:
      type: object
      properties:
        _id: { type: string }
        user: { description: 'User id (populated with name and email in admin views)', oneOf: [{ type: string }, { type: object }] }
        items:
          type: array
          items:
            type: object
            properties:
              product: { type: string }
              name: { type: string }
              sku: { type: string }
              price: { type: number, description: Unit price at the time of purchase }
              quantity: { type: integer }
              subtotal: { type: number }
        totalAmount: { type: number }
        status: { $ref: '#/components/schemas/OrderStatus' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/OrderStatus' }
              changedBy: { type: string }
              note: { type: string }
              changedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
